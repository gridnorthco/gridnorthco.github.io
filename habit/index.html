<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bloom Habits</title>
<meta name="description" content="A habit tracker that lives on your phone. Private, offline, no account.">
<meta name="theme-color" content="#FBF3EE">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Bloom">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
@font-face{font-family:"Nunito";font-weight:400;font-display:swap;src:url(nunito-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Nunito";font-weight:600;font-display:swap;src:url(nunito-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Nunito";font-weight:700;font-display:swap;src:url(nunito-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Nunito";font-weight:800;font-display:swap;src:url(nunito-latin-800-normal.woff2) format("woff2")}
:root{
  --paper:#FBF3EE; --card:#FFFFFF; --ink:#2E2A3A; --muted:#8C8394; --line:#EFE3DC; --soft:#F5E9E2;
  --accent:#5E9C76; --accent-soft:#E2EFE6; --petal:#F2A7B5; --honey:#F6C66B; --danger:#C2553F;
  --r-lg:28px; --r-md:20px; --r-sm:14px;
  --shadow:0 1px 0 rgba(46,42,58,.04),0 10px 24px -14px rgba(94,60,70,.28);
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
:root[data-accent="lavender"]{--accent:#7F6BC4;--accent-soft:#ECE8F8}
:root[data-accent="sunset"]{--accent:#D9785A;--accent-soft:#FBE7DF}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:"Nunito",system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.45}
body{min-height:100vh;min-height:100dvh;overscroll-behavior-y:none}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:10px}
[hidden]{display:none!important}
.app{max-width:480px;margin:0 auto;padding:calc(18px + var(--safe-t)) 18px calc(104px + var(--safe-b));min-height:100dvh}
h1{font-size:28px;line-height:1.15;font-weight:800;margin:0;letter-spacing:-.01em}
h2{font-size:19px;font-weight:800;margin:0}
.sub{color:var(--muted);font-weight:600;font-size:15px}
.card{background:var(--card);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow)}
.stack>*+*{margin-top:14px}
.row{display:flex;align-items:center;gap:12px}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 22px;border-radius:999px;font-weight:800;background:var(--ink);color:#fff}
.btn.accent{background:var(--accent)}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.block{width:100%}
.btn:disabled{opacity:.45}
.link{color:var(--accent);font-weight:800}
.input,textarea{width:100%;border:2px solid var(--line);background:#fff;border-radius:var(--r-sm);padding:13px 14px;font-weight:600;outline:none}
.input:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:none;min-height:84px;line-height:1.4}
label.lbl{display:block;font-weight:800;font-size:14px;margin:0 0 6px}

/* header + week strip */
.top{display:flex;align-items:flex-start;gap:12px;margin-bottom:16px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:18px}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0 10px;border-radius:18px;font-weight:700;color:var(--muted);font-size:12px}
.day b{font-size:16px;color:var(--ink);font-weight:800}
.day .mini{width:26px;height:26px}
.day[aria-current="date"]{background:var(--card);box-shadow:var(--shadow);color:var(--ink)}
.day.future{opacity:.4}

/* bloom hero */
.bloom{position:relative;display:grid;place-items:center;padding:6px 0 4px}
.bloom svg{width:236px;height:236px;overflow:visible}
.bloom .petal{transition:fill .5s ease, transform .5s cubic-bezier(.3,1.6,.5,1);transform-origin:120px 120px}
.bloom .center{position:absolute;inset:0;display:grid;place-items:center;text-align:center;pointer-events:none}
.bloom .center strong{display:block;font-size:40px;line-height:1;font-weight:800}
.bloom .center span{font-weight:700;color:var(--muted);font-size:14px}
.cheer{text-align:center;font-weight:700;color:var(--muted);margin:2px 0 18px;min-height:22px}

/* habit rows */
.habits{display:flex;flex-direction:column;gap:10px}
.habit{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:var(--r-md);padding:12px 12px 12px 14px;box-shadow:var(--shadow)}
.habit .emo{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;font-size:24px;flex:none}
.habit .txt{flex:1;min-width:0}
.habit .name{font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.habit .meta{font-size:13px;font-weight:700;color:var(--muted)}
.habit .meta .fire{color:#E0823D}
.habit.off{opacity:.55}
.check{width:52px;height:52px;border-radius:50%;border:3px solid var(--line);display:grid;place-items:center;flex:none;transition:background .25s,border-color .25s,transform .25s}
.check svg{width:24px;height:24px;stroke:#fff;stroke-width:3.2;fill:none;stroke-dasharray:30;stroke-dashoffset:30;transition:stroke-dashoffset .35s ease .05s}
.check.on{border-color:transparent}
.check.on svg{stroke-dashoffset:0}
.check.pop{animation:pop .45s cubic-bezier(.3,1.7,.5,1)}
@keyframes pop{40%{transform:scale(1.18)}100%{transform:scale(1)}}
.add-row{display:flex;align-items:center;justify-content:center;gap:8px;border:2px dashed #E6D5CC;border-radius:var(--r-md);padding:16px;font-weight:800;color:var(--muted);width:100%}

/* wellbeing */
.well h2{margin-bottom:12px}
.moods{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.mood{font-size:28px;padding:8px 0;border-radius:16px;filter:grayscale(1);opacity:.55;transition:all .2s}
.mood[aria-pressed="true"]{filter:none;opacity:1;background:var(--soft);transform:scale(1.06)}
.drops{display:flex;flex-wrap:wrap;gap:6px}
.drop{width:30px;height:36px}
.drop path{fill:#EDE3DD;transition:fill .2s}
.drop.on path{fill:#7DB7D9}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:40px;height:40px;border-radius:50%;background:var(--soft);font-size:22px;font-weight:800}
.stepper output{min-width:64px;text-align:center;font-weight:800;font-size:18px}
.well-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:14px;margin-top:14px;border-top:2px solid var(--soft)}
.well-row .k{font-weight:800}
.well-row .v{color:var(--muted);font-weight:700;font-size:13px}
.well-row.water{flex-direction:column;align-items:stretch}
.well-row.water .drops{justify-content:space-between;flex-wrap:nowrap}
.well-row.water .drop{flex:1;max-width:34px;height:34px}

/* tab bar */
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + var(--safe-b));width:min(452px,calc(100% - 24px));display:grid;grid-template-columns:repeat(4,1fr);background:rgba(46,42,58,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:26px;padding:8px;z-index:20}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;border-radius:18px;color:#B9B0C2;font-weight:700;font-size:12px}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{background:rgba(255,255,255,.12);color:#fff}

/* garden (progress) */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;margin:0 -2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 14px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);font-weight:800;font-size:14px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px;overflow-x:auto;padding-bottom:4px;direction:rtl}
.heat i{width:13px;height:13px;border-radius:4px;background:#F1E6E0;direction:ltr}
.months{display:flex;justify-content:space-between;font-size:11px;font-weight:700;color:var(--muted);margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--card);border-radius:var(--r-md);padding:14px 12px;box-shadow:var(--shadow)}
.stat strong{display:block;font-size:26px;font-weight:800;line-height:1.1}
.stat span{font-size:12.5px;font-weight:700;color:var(--muted)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.cal .dn{font-size:11px;font-weight:800;color:var(--muted)}
.cal .c{aspect-ratio:1;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:13px;background:#F6EEE9;color:var(--muted)}
.cal .c.done{background:var(--accent);color:#fff}
.cal .c.part{background:var(--accent-soft);color:var(--ink)}
.cal .c.off{background:transparent}
.cal .c.today{box-shadow:inset 0 0 0 2px var(--ink)}
.bars{display:flex;align-items:flex-end;gap:6px;height:120px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;font-size:11px;font-weight:700;color:var(--muted)}
.bars b{display:block;width:100%;border-radius:8px 8px 4px 4px;background:var(--accent);min-height:4px}
.insight{display:flex;gap:12px;align-items:flex-start}
.insight .emo{font-size:22px}

/* review */
.stars{display:flex;gap:6px}
.star{font-size:30px;color:#E7D9D1;transition:color .15s}
.star[aria-pressed="true"]{color:var(--honey)}
.past{border-top:2px solid var(--soft);padding-top:12px;margin-top:12px}
.past p{margin:4px 0 0;color:var(--muted);font-weight:600;font-size:14px}

/* settings */
.list{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;width:100%;padding:16px 18px;text-align:left;font-weight:700}
.item+.item{border-top:2px solid var(--soft)}
.item .ic{width:36px;height:36px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-size:18px;flex:none}
.item small{display:block;color:var(--muted);font-weight:600;font-size:13px}
.swatches{display:flex;gap:10px}
.sw{width:38px;height:38px;border-radius:50%;box-shadow:inset 0 0 0 3px rgba(255,255,255,.7)}
.sw[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:2px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(46,42,58,.38);z-index:40;opacity:0;transition:opacity .25s}
.scrim.show{opacity:1}
.sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,100%);width:min(480px,100%);max-height:92dvh;overflow:auto;background:var(--paper);border-radius:28px 28px 0 0;padding:10px 20px calc(24px + var(--safe-b));z-index:41;transition:transform .32s cubic-bezier(.2,.9,.3,1)}
.sheet.show{transform:translate(-50%,0)}
.grab{width:44px;height:5px;border-radius:5px;background:#E2D3CA;margin:0 auto 14px}
.emojis{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.emojis button{font-size:24px;padding:6px 0;border-radius:12px}
.emojis button[aria-pressed="true"]{background:var(--card);box-shadow:var(--shadow)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--soft);border-radius:16px;padding:4px}
.seg button{padding:10px 4px;border-radius:12px;font-weight:800;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.daypick{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.daypick button{aspect-ratio:1;border-radius:50%;background:var(--card);font-weight:800;box-shadow:var(--shadow)}
.daypick button[aria-pressed="true"]{background:var(--accent);color:#fff}

/* welcome */
.welcome{min-height:calc(100dvh - 140px);display:flex;flex-direction:column;justify-content:center}
.welcome .logo{width:96px;height:96px;border-radius:28px;box-shadow:var(--shadow);margin-bottom:22px}
.welcome h1{font-size:34px}
.welcome p{color:var(--muted);font-weight:600;font-size:17px;margin:10px 0 26px;max-width:34ch}
.err{color:var(--danger);font-weight:700;font-size:14px;min-height:20px;margin-top:8px}
.starter{display:flex;flex-wrap:wrap;gap:8px}
.starter button{padding:11px 14px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);font-weight:800}
.starter button[aria-pressed="true"]{background:var(--accent);color:#fff}
.banner{display:flex;gap:12px;align-items:center;background:var(--ink);color:#fff;border-radius:var(--r-md);padding:12px 14px;margin-bottom:16px}
.banner b{display:block}
.banner small{color:#D8D0DE;font-weight:600}
.banner .btn{min-height:38px;padding:0 14px;background:#fff;color:var(--ink);font-size:14px}
.steps{counter-reset:s;list-style:none;padding:0;margin:0}
.steps li{counter-increment:s;display:flex;gap:12px;align-items:flex-start;padding:10px 0;font-weight:700}
.steps li::before{content:counter(s);width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none;font-weight:800}
.toast{position:fixed;left:50%;bottom:calc(98px + var(--safe-b));transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:999px;font-weight:800;opacity:0;transition:all .25s;z-index:60;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main class="app" id="app" aria-live="polite"></main>
<nav class="tabs" id="tabs" hidden aria-label="Main">
  <button class="tab" data-tab="today"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Today</button>
  <button class="tab" data-tab="garden"><svg viewBox="0 0 24 24"><path d="M12 21V10"/><path d="M12 13c-4 0-6-3-6-7 4 0 6 3 6 7z"/><path d="M12 10c0-4 2-7 6-7 0 4-2 7-6 7z"/><path d="M5 21h14"/></svg>Progress</button>
  <button class="tab" data-tab="review"><svg viewBox="0 0 24 24"><path d="M4 5h16v14H4z"/><path d="M8 3v4M16 3v4M4 10h16"/><path d="m9 15 2 2 4-4"/></svg>Review</button>
  <button class="tab" data-tab="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Settings</button>
</nav>
<div class="scrim" id="scrim" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" hidden><div class="grab"></div><div id="sheetBody"></div></section>
<div class="toast" id="toast" role="status"></div>
<canvas id="fx"></canvas>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<script>
"use strict";
(() => {
const KEY = "bloom-habits-v1";
const CODE_HASH = "01214df978eef3a8a41a58dd6d3bd4f274838827f0b1250f5bc21ba662966bc4";
const COLORS = ["#F2A7B5","#F6C66B","#9FD3B1","#8EC5E8","#C6B4F0","#F4B48E","#B9D88B","#E7A2D6"];
const EMOJIS = ["💧","🏃","📚","🧘","🥗","😴","✍️","🎸","🦷","💊","🚶","🧹","💰","📵","🙏","🌿","☀️","🍎","💪","🎨","📞","🛏️","🧠","❤️"];
const STARTERS = [["💧","Drink water"],["🚶","Walk 20 minutes"],["📚","Read 10 pages"],["🧘","Meditate"],["😴","Bed by 11"],["📵","No phone in bed"],["🥗","Eat a vegetable"],["✍️","Journal"],["💪","Work out"],["💰","Track spending"]];
const DN = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const MN = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const MOODS = ["😣","😕","😐","🙂","😄"];
const $ = s => document.querySelector(s);
const app = $("#app");
const pad = n => String(n).padStart(2,"0");
const dkey = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const fromKey = k => { const [y,m,d] = k.split("-").map(Number); return new Date(y,m-1,d); };
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const today = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Math.random().toString(36).slice(2,9);
const buzz = () => { try { navigator.vibrate && navigator.vibrate(12); } catch(e){} };

/* ---------- state ---------- */
const blank = () => ({v:1, unlocked:false, name:"", accent:"sage", habits:[], checks:{}, logs:{}, reviews:{}, waterGoal:8, sleepGoal:8, onboarded:false});
let S;
try { S = Object.assign(blank(), JSON.parse(localStorage.getItem(KEY) || "{}")); } catch(e) { S = blank(); }
let memOnly = false;
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){ if(!memOnly){ memOnly = true; toast("Storage is blocked — changes won't be kept"); } } }
let view = "today", sel = dkey(today()), gardenHabit = "all";
document.documentElement.dataset.accent = S.accent;

/* ---------- habit logic ---------- */
const active = () => S.habits.filter(h => !h.archived);
const isSched = (h, d) => h.type === "days" ? h.days.includes(d.getDay()) : true;
const isDone = (h, k) => (S.checks[k] || []).includes(h.id);
const started = (h, d) => dkey(d) >= h.created;
function weekStart(d){ return addDays(d, -d.getDay()); }
function weekCount(h, d){ const ws = weekStart(d); let n = 0; for(let i=0;i<7;i++) if(isDone(h, dkey(addDays(ws,i)))) n++; return n; }
function streak(h){
  const t = today();
  if(h.type === "weekly"){
    let n = 0, ws = weekStart(t);
    for(let w=0; w<300; w++){
      const d = addDays(ws, -7*w);
      if(dkey(addDays(d,6)) < h.created) break;
      const c = weekCount(h, d);
      if(c >= h.per) n++; else if(w === 0) continue; else break;
    }
    return n;
  }
  let n = 0;
  for(let i=0; i<1500; i++){
    const d = addDays(t, -i), k = dkey(d);
    if(k < h.created) break;
    if(!isSched(h,d)) { if(isDone(h,k)) n++; continue; }
    if(isDone(h,k)) n++; else if(i === 0) continue; else break;
  }
  return n;
}
function bestStreak(h){
  const t = today(); let best = 0, cur = 0;
  if(h.type === "weekly"){
    let d = weekStart(fromKey(h.created));
    while(d <= t){ const c = weekCount(h,d); if(c >= h.per){ cur++; best = Math.max(best,cur); } else if(addDays(d,6) < t) cur = 0; d = addDays(d,7); }
    return best;
  }
  let d = fromKey(h.created);
  while(d <= t){ const k = dkey(d);
    if(isDone(h,k)){ cur++; best = Math.max(best,cur); }
    else if(isSched(h,d) && d < t) cur = 0;
    d = addDays(d,1); }
  return best;
}
function rate(h, days){
  const t = today(); let s = 0, n = 0;
  if(h.type === "weekly"){
    const weeks = Math.max(1, Math.round(days/7)); let hit = 0, cnt = 0;
    for(let w=1; w<=weeks; w++){ const d = addDays(weekStart(t), -7*w); if(dkey(addDays(d,6)) < h.created) break; cnt++; if(weekCount(h,d) >= h.per) hit++; }
    return cnt ? hit/cnt : null;
  }
  for(let i=0;i<days;i++){ const d = addDays(t,-i), k = dkey(d); if(k < h.created) break; if(isSched(h,d)){ n++; if(isDone(h,k)) s++; } }
  return n ? s/n : null;
}
function dayScore(d, onlyId){
  const k = dkey(d); let s = 0, n = 0;
  for(const h of active()){
    if(onlyId && h.id !== onlyId) continue;
    if(k < h.created) continue;
    if(h.type === "weekly"){ if(onlyId){ n++; if(isDone(h,k)) s++; } continue; }
    if(isSched(h,d)){ n++; if(isDone(h,k)) s++; }
  }
  return n ? s/n : null;
}
function schedText(h){
  if(h.type === "weekly") return h.per + "× a week";
  if(h.type === "days"){ const d = h.days.slice().sort(); if(d.length === 7) return "Every day"; if(d.join() === "1,2,3,4,5") return "Weekdays"; if(d.join() === "0,6") return "Weekends"; return d.map(i => DN[i]).join(" "); }
  return "Every day";
}
function toggle(h, k){
  const arr = S.checks[k] || (S.checks[k] = []);
  const i = arr.indexOf(h.id);
  if(i >= 0) arr.splice(i,1); else arr.push(h.id);
  if(!arr.length) delete S.checks[k];
  save();
  return i < 0;
}

function ring(p, size=26, w=4){

}

/* ---------- bloom flower ---------- */
function bloomSVG(list, k){
  const n = Math.max(list.length, 1), cx = 120, cy = 120;
  let petals = "";
  list.forEach((h,i) => {
    const a = (360/n)*i;
    const done = isDone(h,k);
    const L = n <= 3 ? 92 : n <= 6 ? 88 : 84, W = Math.max(16, Math.min(40, 200/n));
    petals += `<g transform="rotate(${a} ${cx} ${cy})"><path class="petal" d="M${cx} ${cy-26} C ${cx+W} ${cy-40}, ${cx+W*.7} ${cy-L}, ${cx} ${cy-L-6} C ${cx-W*.7} ${cy-L}, ${cx-W} ${cy-40}, ${cx} ${cy-26} Z" fill="${done ? h.color : "#F1E4DD"}" style="${done ? "transform:scale(1.04)" : ""}"/></g>`;
  });
  if(!list.length) petals = `<circle cx="${cx}" cy="${cy}" r="70" fill="#F1E4DD"/>`;
  return `<svg viewBox="0 0 240 240" role="img" aria-label="Today's progress">${petals}<circle cx="${cx}" cy="${cy}" r="44" fill="var(--card)"/><circle cx="${cx}" cy="${cy}" r="44" fill="none" stroke="var(--line)" stroke-width="2"/></svg>`;
}

function renderGarden(){
  const t = today(), hs = active();
  const only = gardenHabit === "all" ? null : hs.find(h => h.id === gardenHabit);
  const start = addDays(weekStart(t), -7*25);
  let cells = "";
  for(let i=0; i<26*7; i++){
    const d = addDays(start, i);
    let bg = "#F1E6E0";
    if(d <= t){ const s = dayScore(d, only && only.id); if(s != null && s > 0){ bg = s >= 1 ? "var(--accent)" : s >= .66 ? tint(getAccent(), .7) : s >= .33 ? tint(getAccent(), .45) : tint(getAccent(), .22); } }
    else bg = "transparent";
    cells = `<i style="background:${bg}" title="${dkey(d)}"></i>` + cells;
  }
  const monthsRow = [5,4,3,2,1,0].map(m => MN[(t.getMonth()-m+12)%12]);
  const pick = only ? [only] : hs;
  const cur = only ? streak(only) : Math.max(0, ...hs.map(streak));
  const best = only ? bestStreak(only) : Math.max(0, ...hs.map(bestStreak));
  const r30 = only ? rate(only,30) : avg(hs.map(h => rate(h,30)));
  // month calendar
  const m0 = new Date(t.getFullYear(), t.getMonth(), 1), dim = new Date(t.getFullYear(), t.getMonth()+1, 0).getDate();
  let cal = DN.map(x => `<div class="dn">${x[0]}</div>`).join("") + Array.from({length:m0.getDay()}, () => `<div class="c off"></div>`).join("");
  for(let i=1;i<=dim;i++){ const d = new Date(t.getFullYear(), t.getMonth(), i); const s = d <= t ? dayScore(d, only && only.id) : null;
    cal += `<div class="c ${s===1?"done":s>0?"part":""} ${dkey(d)===dkey(t)?"today":""}">${i}</div>`; }
  // weekly bars (last 8 weeks)
  const bars = Array.from({length:8}, (_,i) => { const ws = addDays(weekStart(t), -7*(7-i)); let s=0,n=0; for(let j=0;j<7;j++){ const d = addDays(ws,j); if(d>t) break; const v = dayScore(d, only && only.id); if(v!=null){ s+=v; n++; } } return {lab: MN[ws.getMonth()]+" "+ws.getDate(), v: n ? s/n : 0}; });
  // mood insight
  let insight = "";
  const lift = moodLift(only ? [only] : hs);
  if(lift) insight = `<div class="card insight"><div class="emo">${lift.h.emoji}</div><div><b>${lift.d >= 0 ? "Your mood is higher" : "Your mood dips"} on ${esc(lift.h.name.toLowerCase())} days</b><div class="sub">${lift.d>=0?"+":""}${lift.d.toFixed(1)} on a 5-point scale, from ${lift.n} days of mood check-ins.</div></div></div>`;
  app.innerHTML = `<div class="top"><div class="spacer"><div class="sub">The last six months</div><h1>Progress</h1></div></div>
  <div class="chips" role="group" aria-label="Show"><button class="chip" aria-pressed="${!only}" data-act="gh" data-id="all">All habits</button>${hs.map(h => `<button class="chip" aria-pressed="${only&&only.id===h.id}" data-act="gh" data-id="${h.id}">${h.emoji} ${esc(h.name)}</button>`).join("")}</div>
  <div class="stack">
    <div class="stats"><div class="stat"><strong>${cur}</strong><span>${only && only.type==="weekly" ? "weeks" : "days"} in a row</span></div><div class="stat"><strong>${best}</strong><span>best streak</span></div><div class="stat"><strong>${r30==null?"–":Math.round(r30*100)+"%"}</strong><span>last 30 days</span></div></div>
    <div class="card"><h2 style="margin-bottom:12px">Every day, colored in</h2><div class="heat">${cells}</div><div class="months">${monthsRow.map(m => `<span>${m}</span>`).join("")}</div></div>
    <div class="card"><h2 style="margin-bottom:12px">${MN[t.getMonth()]} ${t.getFullYear()}</h2><div class="cal">${cal}</div></div>
    <div class="card"><h2 style="margin-bottom:14px">Week by week</h2><div class="bars">${bars.map(b => `<div><b style="height:${Math.max(4,b.v*100)}%;opacity:${.35+.65*b.v}"></b>${b.lab.split(" ")[1]}</div>`).join("")}</div></div>
    ${insight}
  </div>`;
}
function getAccent(){ return getComputedStyle(document.documentElement).getPropertyValue("--accent").trim() || "#5E9C76"; }
function avg(a){ const v = a.filter(x => x != null); return v.length ? v.reduce((p,c)=>p+c,0)/v.length : null; }
function moodLift(hs){
  let best = null;
  for(const h of hs){
    let a=[], b=[];
    for(const [k,l] of Object.entries(S.logs)){ if(!l.mood || k < h.created) continue; const d = fromKey(k); if(h.type!=="weekly" && !isSched(h,d)) continue; (isDone(h,k)?a:b).push(l.mood); }
    if(a.length >= 3 && b.length >= 3){ const d = avg(a) - avg(b); if(!best || Math.abs(d) > Math.abs(best.d)) best = {h, d, n:a.length+b.length}; }
  }
  return best && Math.abs(best.d) >= .2 ? best : null;
}

    <div><span class="lbl">Color</span><div class="swatches" style="flex-wrap:wrap">${COLORS.map(c => `<button class="sw" style="background:${c}" aria-label="Color ${c}" aria-pressed="${d.color===c}" data-act="col" data-v="${c}"></button>`).join("")}</div></div>
    <div><span class="lbl">How often</span><div class="seg"><button aria-pressed="${d.type==="daily"}" data-act="type" data-v="daily">Every day</button><button aria-pressed="${d.type==="days"}" data-act="type" data-v="days">Some days</button><button aria-pressed="${d.type==="weekly"}" data-act="type" data-v="weekly">× a week</button></div></div>
    ${d.type==="days" ? `<div class="daypick">${DN.map((n,i) => `<button aria-pressed="${d.days.includes(i)}" data-act="dp" data-v="${i}" aria-label="${n}">${n[0]}</button>`).join("")}</div>` : ""}
    ${d.type==="weekly" ? `<div class="row"><div class="spacer"><b>Times a week</b></div><div class="stepper"><button data-act="per" data-v="-1" aria-label="Fewer">−</button><output>${d.per}</output><button data-act="per" data-v="1" aria-label="More">+</button></div></div>` : ""}
    <div><label class="lbl" for="hr">Reminder time (optional)</label><input class="input" id="hr" type="time" value="${esc(d.remind)}"></div>
    <button class="btn accent block" data-act="saveHabit">${existing ? "Save changes" : "Add habit"}</button>
    ${existing ? `<button class="btn ghost block" data-act="archive">Pause this habit</button>` : ""}
  </div>`);
}
function readDraftInputs(){ const n = $("#hn"), r = $("#hr"); if(n) draft.name = n.value; if(r) draft.remind = r.value; }

/* ---------- calendar (.ics) ---------- */
function remindDays(h){ return h.type === "days" ? h.days.slice().sort() : h.type === "weekly" ? (h.per >= 5 ? [1,2,3,4,5] : h.per === 4 ? [1,2,4,5] : h.per === 3 ? [1,3,5] : h.per === 2 ? [2,4] : [0]) : [0,1,2,3,4,5,6]; }
function icsText(){
  const lines = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//GridNorthCo//Bloom Habits//EN","CALSCALE:GREGORIAN","METHOD:PUBLISH","X-WR-CALNAME:Bloom Habits"];
  const BY = ["SU","MO","TU","WE","TH","FR","SA"];
  const stamp = new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d+Z$/,"Z");
  const escI = s => String(s).replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,");
  for(const h of active().filter(x => x.remind)){
    const [hh,mm] = h.remind.split(":").map(Number);
    const days = remindDays(h);
    let st = today(); for(let i=0;i<7 && !days.includes(st.getDay());i++) st = addDays(st,1);
    const ymd = dkey(st).replace(/-/g,""), t0 = pad(hh)+pad(mm)+"00";
    const em = hh*60+mm+10, t1 = pad(Math.min(23,Math.floor(em/60)))+pad(em>=1440?59:em%60)+"00";
    lines.push("BEGIN:VEVENT","UID:bloom-"+h.id+"@gridnorthco","DTSTAMP:"+stamp,"DTSTART:"+ymd+"T"+t0,"DTEND:"+ymd+"T"+t1,
      "RRULE:FREQ=WEEKLY;BYDAY="+days.map(i => BY[i]).join(","),"SUMMARY:"+escI(h.emoji+" "+h.name),"DESCRIPTION:Open Bloom and tick it off",
      "BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+escI(h.name),"TRIGGER:PT0M","END:VALARM","END:VEVENT");
  }
  lines.push("END:VCALENDAR");
  return lines.join("\r\n") + "\r\n";
}
function download(name, text, type){
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text],{type})); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}

/* ---------- confetti ---------- */
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c = $("#fx"), x = c.getContext("2d"), dpr = devicePixelRatio || 1;
  c.width = innerWidth*dpr; c.height = innerHeight*dpr; x.scale(dpr,dpr);
  const parts = Array.from({length:70}, () => ({x:innerWidth/2, y:innerHeight*.32, vx:(Math.random()-.5)*9, vy:-Math.random()*9-3, r:Math.random()*6+4, a:Math.random()*6, va:(Math.random()-.5)*.3, col:COLORS[Math.floor(Math.random()*COLORS.length)]}));
  let f = 0;
  (function tick(){
    x.clearRect(0,0,innerWidth,innerHeight);
    for(const p of parts){ p.vy += .28; p.x += p.vx; p.y += p.vy; p.a += p.va;
      x.save(); x.translate(p.x,p.y); x.rotate(p.a); x.fillStyle = p.col; x.beginPath(); x.ellipse(0,0,p.r,p.r*.55,0,0,Math.PI*2); x.fill(); x.restore(); }
    if(++f < 110) requestAnimationFrame(tick); else x.clearRect(0,0,innerWidth,innerHeight);
  })();
}

/* ---------- events ---------- */
async function sha256(s){ const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2,"0")).join(""); }
document.addEventListener("click", async e => {
  const b = e.target.closest("[data-act],[data-tab]"); if(!b) return;
  if(b.dataset.tab){ view = b.dataset.tab; if(view === "today") sel = dkey(today()); render(); scrollTo(0,0); return; }
  const a = b.dataset.act, id = b.dataset.id, v = b.dataset.v;
  const H = id ? S.habits.find(h => h.id === id) : null;
  switch(a){
    case "unlock": {
      const code = ($("#code").value || "").trim().toUpperCase().replace(/\s+/g,"");
      let ok = false; try { ok = (await sha256(code)) === CODE_HASH; } catch(err){ ok = code === "GROW-DAILY-27"; }
      if(ok){ S.unlocked = true; save(); render(); } else $("#codeErr").textContent = "That code doesn't match. Check the Start Here PDF from your Etsy download.";
      break; }
    case "starter": { const i = +b.dataset.i; starterSel.has(i) ? starterSel.delete(i) : starterSel.add(i); const nm = $("#nm").value; renderOnboard(); $("#nm").value = nm; break; }
    case "start": {
      S.name = ($("#nm").value || "").trim().slice(0,24);
      [...starterSel].forEach((i,j) => { const [e,t] = STARTERS[i]; S.habits.push({id:uid(), name:t, emoji:e, color:COLORS[j % COLORS.length], type:"daily", days:[0,1,2,3,4,5,6], per:3, remind:"", created:dkey(today()), archived:false}); });
      S.onboarded = true; save(); view = "today"; render(); break; }
    case "day": sel = b.dataset.k; render(); break;
    case "check": {
      const wasAll = (() => { const d = fromKey(sel); const due = active().filter(h => sel >= h.created && (h.type==="weekly"||isSched(h,d))); return due.length && due.every(h => isDone(h,sel)); })();
      const on = toggle(H, sel); buzz(); render();
      const btn = document.querySelector(`.check[data-id="${id}"]`); if(btn && on) btn.classList.add("pop");
      const d = fromKey(sel); const due = active().filter(h => sel >= h.created && (h.type==="weekly"||isSched(h,d)));
      if(on && !wasAll && due.every(h => isDone(h,sel))) confetti();
      break; }
    case "mood": { const l = S.logs[sel] || (S.logs[sel] = {}); l.mood = l.mood === +v ? undefined : +v; save(); buzz(); render(); break; }
    case "water": { const l = S.logs[sel] || (S.logs[sel] = {}); l.water = (l.water||0) === +v ? +v-1 : +v; save(); buzz(); render(); break; }
    case "sleep": { const l = S.logs[sel] || (S.logs[sel] = {}); const cur = l.sleep != null ? l.sleep : S.sleepGoal - (+v > 0 ? .5 : -.5); l.sleep = Math.max(0, Math.min(14, cur + +v)); save(); render(); break; }
    case "new": editor(null); break;
    case "edit": editor(H); break;
    case "emo": readDraftInputs(); draft.emoji = v; drawEditor(S.habits.some(h => h.id === draft.id)); break;
    case "col": readDraftInputs(); draft.color = v; drawEditor(S.habits.some(h => h.id === draft.id)); break;
    case "type": readDraftInputs(); draft.type = v; if(v==="days" && draft.days.length===7) draft.days=[1,2,3,4,5]; drawEditor(S.habits.some(h => h.id === draft.id)); break;
    case "dp": { readDraftInputs(); const i = +v, k = draft.days.indexOf(i); k>=0 ? draft.days.splice(k,1) : draft.days.push(i); drawEditor(S.habits.some(h => h.id === draft.id)); break; }
    case "per": readDraftInputs(); draft.per = Math.max(1, Math.min(6, draft.per + +v)); drawEditor(S.habits.some(h => h.id === draft.id)); break;
    case "saveHabit": {
      readDraftInputs(); draft.name = draft.name.trim();
      if(!draft.name){ $("#hn").focus(); toast("Give your habit a name"); break; }
      if(draft.type==="days" && !draft.days.length){ toast("Pick at least one day"); break; }
      if(draft.type==="daily") draft.days = [0,1,2,3,4,5,6];
      const i = S.habits.findIndex(h => h.id === draft.id);
      if(i >= 0) S.habits[i] = draft; else S.habits.push(draft);
      save(); closeSheet(); render(); toast(i >= 0 ? "Saved" : "Habit added"); break; }
    case "archive": { const i = S.habits.findIndex(h => h.id === draft.id); if(i>=0){ S.habits[i].archived = true; save(); } closeSheet(); render(); toast("Habit paused — your history is kept"); break; }
    case "gh": gardenHabit = id; render(); break;
    case "rate": { const wk = dkey(weekStart(today())); const r = S.reviews[wk] || (S.reviews[wk] = {}); r.rate = +v; save(); render(); break; }
    case "accent": S.accent = v; document.documentElement.dataset.accent = v; save(); render(); break;
    case "goal": { const k = b.dataset.k; S[k] = Math.max(1, Math.min(k==="waterGoal"?16:12, S[k] + +v)); save(); render(); break; }
    case "reminders": {
      if(!active().some(h => h.remind)){ toast("Open a habit and set a reminder time"); break; }
      if(isIOS){
        const clean = t => String(t).replace(/[;,#%]/g," ").trim().slice(0,40);
        const recs = active().filter(h => h.remind).map(h => {
          const days = remindDays(h); const mask = [0,1,2,3,4,5,6].map(i => days.includes(i) ? "1" : "0").join("");
          const [hh,mm] = h.remind.split(":").map(Number); const t = today();
          return "H," + clean(h.emoji + " " + h.name) + "," + hh + ":" + pad(mm) + "," + mask + "," + t.getFullYear() + "-" + (t.getMonth()+1) + "-" + t.getDate();
        });
        const url = "https://gridnorthco.github.io/calendar/#" + encodeURIComponent("GNC1;" + today().getFullYear() + ";" + recs.join(";"));
        openSheet(`<div class="stack"><h2>Add reminders to your iPhone calendar</h2><ol class="steps"><li>Tap “Open calendar page”. It opens in Safari with your habits filled in.</li><li>Tap “Add to Apple Calendar”.</li><li>Tap “Add All”. Each habit now reminds you at its time.</li></ol><a class="btn accent block" href="${url}" target="_blank" rel="noopener" data-act="close">Open calendar page</a></div>`);
        break;
      }
      const ics = icsText();
      if(false) location.href = "";
      else { download("bloom-habit-reminders.ics", ics, "text/calendar"); toast("Open the file to add your reminders"); }
      break; }
    case "manage": openSheet(`<div class="stack"><h2>Manage habits</h2>${S.habits.length ? S.habits.map(h => `<div class="habit ${h.archived?"off":""}"><div class="emo" style="background:${tint(h.color,.28)}">${h.emoji}</div><div class="txt"><div class="name">${esc(h.name)}</div><div class="meta">${h.archived?"Paused":schedText(h)}</div></div>${h.archived?`<button class="btn ghost" style="min-height:40px" data-act="unarchive" data-id="${h.id}">Resume</button>`:`<button class="btn ghost" style="min-height:40px" data-act="edit" data-id="${h.id}">Edit</button>`}</div>`).join("") : `<p class="sub">No habits yet.</p>`}<button class="btn accent block" data-act="new">+ Add a habit</button></div>`); break;
    case "unarchive": H.archived = false; save(); closeSheet(); render(); toast("Welcome back"); break;
    case "export": {
      const txt = JSON.stringify(S, null, 1), name = "bloom-backup-" + dkey(today()) + ".json";
      try { const f = new File([txt], name, {type:"application/json"}); if(navigator.canShare && navigator.canShare({files:[f]})){ await navigator.share({files:[f], title:"Bloom backup"}); break; } } catch(err){ if(err && err.name === "AbortError") break; }
      download(name, txt, "application/json"); toast("Backup saved"); break; }
    case "import": $("#importFile").click(); break;
    case "reset": openSheet(`<div class="stack"><h2>Erase everything?</h2><p class="sub">This removes all habits, check-ins and reviews from this phone. Save a backup first if you might want them back.</p><button class="btn block" style="background:var(--danger)" data-act="resetYes">Erase everything</button><button class="btn ghost block" data-act="close">Keep my data</button></div>`); break;
    case "resetYes": { const unlocked = S.unlocked; S = blank(); S.unlocked = unlocked; save(); closeSheet(); view = "today"; render(); break; }
    case "close": closeSheet(); break;
    case "install": if(deferredPrompt){ deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt = null; render(); } break;
    case "install-ios": openSheet(`<div class="stack"><h2>Add Bloom to your Home Screen</h2><ol class="steps"><li>Tap the Share button <span aria-hidden="true">⬆️</span> at the bottom of Safari.</li><li>Scroll down and tap “Add to Home Screen”.</li><li>Tap “Add”, then open Bloom from your Home Screen.</li></ol><p class="sub">Tip: set up your habits after opening Bloom from the Home Screen — the app keeps its own data, separate from Safari.</p><button class="btn accent block" data-act="close">Got it</button></div>`); break;
  }
});
$("#scrim").addEventListener("click", closeSheet);
document.addEventListener("input", e => {
  const t = e.target;
  if(t.dataset.rv){ const wk = dkey(weekStart(today())); const r = S.reviews[wk] || (S.reviews[wk] = {}); r[t.dataset.rv] = t.value; save(); }
  if(t.dataset.set === "name"){ S.name = t.value.slice(0,24); save(); }
});
document.addEventListener("keydown", e => { if(e.key === "Escape" && !$("#sheet").hidden) closeSheet(); if(e.key === "Enter" && e.target.id === "code") document.querySelector('[data-act="unlock"]').click(); });
$("#importFile").addEventListener("change", async e => {
  const f = e.target.files[0]; if(!f) return;
  try { const d = JSON.parse(await f.text()); if(!d || !Array.isArray(d.habits)) throw 0; S = Object.assign(blank(), d, {unlocked:true}); save(); document.documentElement.dataset.accent = S.accent; render(); toast("Backup restored"); }
  catch(err){ toast("That file isn't a Bloom backup"); }
  e.target.value = "";
});
document.addEventListener("visibilitychange", () => { if(!document.hidden && view === "today"){ const t = dkey(today()); if(sel > t) sel = t; render(); } });
if("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
render();
})();
</script>
